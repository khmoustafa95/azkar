name: holly_quran
description: ماسة القلوب — تطبيق إسلامي لخدمات الحج والعمرة
publish_to: 'none' # Remove this line if you wish to publish to pub.dev
version: 1.8.5+21

environment:
  sdk: '>=3.9.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  go_router: ^15.0.0
  flutter_bloc: ^9.1.0
  get_it: ^8.0.3
  shared_preferences: ^2.5.3
  hijri: ^3.0.0
  url_launcher: ^6.1.10
  audioplayers: ^6.4.0
  chewie: ^1.11.3
  video_player: ^2.9.5
  flutter_svg: ^2.0.10+1
  adhan_dart: ^2.0.1
  wakelock_plus: ^1.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_native_splash: ^2.2.16
  flutter_launcher_icons: ^0.14.3
  change_app_package_name: ^1.5.0
  rename_app: ^1.6.6

# flutter_native_splash
flutter_native_splash:
  color: "#673AB7"
  image: assets/icon/logo.jpeg
  fullscreen: true
  android: true
  ios: true
  web: true
  android_gravity: fill
  ios_content_mode: scaleAspectFill


#flutter_icons
flutter_launcher_icons:
  android: "launcher_icon"
  image_path: "assets/icon/logo.jpeg"
  ios: true

flutter:
  uses-material-design: true
  # To add assets to your application, add an assets section, like this:
  assets:
    - assets/images/
    - assets/icon/
    - assets/json/
    - assets/groups/svg/
    - assets/members/
    - assets/videos/
    - assets/admin_instructions/
    - assets/admin_advices/
    - assets/sound_prayers/
    - assets/text_prayers/
    - assets/with_hajj/
    - assets/do_you_know/
    - assets/figh_hajj2/
    - assets/fiqh_hajj1/
    - assets/quran_data/

  fonts:
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo/Cairo-Regular.ttf
          weight: 400
        - asset: assets/fonts/Cairo/Cairo-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Cairo/Cairo-Bold.ttf
          weight: 700
